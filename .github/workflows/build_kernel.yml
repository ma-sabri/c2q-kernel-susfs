name: Build Samsung SM8250 Kernel with SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile SM8250 Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt update
          sudo apt install -y git cpio tar xz-utils bc bison flex libssl-dev make gcc g++ \
                              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
                              gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libelf-dev

      - name: Clone Google Prebuilt Clang (r383902 - Android 11 Toolchain)
        run: |
      - name: Install Clang
        run: |
          sudo apt install -y clang llvm
      - name: Clone Samsung SM8250 Kernel Source
        run: |
          git clone --depth=1 https://github.com/Gorhanhee/android_kernel_samsung_c2q.git kernel
          cd kernel
          git submodule update --init --recursive || true

      - name: Integrate KernelSU-Next & SuSFS
        working-directory: kernel
        run: |
          # 1. Setup KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # 2. Apply SuSFS 4.19 Kernel Patches
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs
          cp susfs/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

          # Copy SuSFS implementation into KernelSU directory
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./ 2>/dev/null || true
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cp -r susfs/kernel_patches/include/linux/susfs* include/linux/ 2>/dev/null || true
          cp -r susfs/kernel_patches/fs/susfs* fs/ 2>/dev/null || true

      - name: Build Kernel Image
        working-directory: kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Defconfig
          make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- vendor/kona-perf_defconfig

          # 2. Enable KernelSU & SuSFS configs
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          scripts/config --file out/.config --enable CONFIG_SUSFS
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_SU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT

          make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          # 3. Compile Image
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-SuSFS-SM8250
          path: kernel/out/arch/arm64/boot/Image
